name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: typecheck, lint e testes de unidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:unit

  integration:
    name: testes de integração (PostgreSQL e MiniStack reais)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run infra:up
      - run: bun run test:integration
      - name: logs da infraestrutura
        if: failure()
        run: docker compose logs --no-color
      - name: derrubar a infraestrutura
        if: always()
        run: docker compose down -v
