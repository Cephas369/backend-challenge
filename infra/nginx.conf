# Balanceia entre as réplicas da aplicação. O DNS do Docker devolve um endereço por réplica;
# com o resolver e a variável, o nginx reresolve a cada 10 s e alterna entre todos (round-robin).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;

  location / {
    set $app http://app:3000;
    proxy_pass $app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # só tenta outra réplica se a conexão falhar; um POST já enviado nunca é repetido pelo nginx
    proxy_next_upstream error timeout;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
  }
}
